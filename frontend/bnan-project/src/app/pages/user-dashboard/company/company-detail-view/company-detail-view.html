<div class="flex-grow-1 p-4">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">

    <h4 class="mb-0">Detalles de la Empresa</h4>

    <div class="d-flex gap-2">

      <a
        class="btn btn-sm btn-outline-primary me-2"
        [routerLink]="['/dashboard/empresas-form', company().id]"
      >
        <i class="bi bi-pencil"></i>
      </a>

      <button
        class="btn btn-sm btn-outline-danger"
        (click)="deleteCompany(company().id)"
      >
        <i class="bi bi-trash"></i>
      </button>

    </div>
  </div>

  <!-- Contenido centrado -->
  <div class="d-flex justify-content-center">

    <div class="w-100" style="max-width: 800px">

      <div class="card border-0 shadow-sm p-3">

        <div class="table-responsive">

          <table class="table align-middle mb-0">

            <tbody>

              <tr>
                <th class="bg-light w-25">Nombre</th>
                <td>{{ company().name }}</td>
              </tr>

              <tr>
                <th class="bg-light">CUIL</th>
                <td>{{ company().cuil }}</td>
              </tr>

              <tr>
                <th class="bg-light">Email</th>
                <td>{{ company().email }}</td>
              </tr>

              <tr>
                <th class="bg-light">Teléfono</th>
                <td>{{ company().phone }}</td>
              </tr>

              <tr>
                <th class="bg-light">Estado</th>

                <td>

                  @if (company().enabled) {

                    <span class="badge bg-success-subtle text-success">
                      Activa
                    </span>

                  } @else {

                    <span class="badge bg-secondary-subtle text-secondary">
                      Inactiva
                    </span>

                  }

                </td>
              </tr>

              <tr>
                <th class="bg-light">Creado</th>
                <td>{{ company().created_at }}</td>
              </tr>

              <tr>
                <th class="bg-light">Actualizado</th>
                <td>{{ company().updated_at }}</td>
              </tr>

            </tbody>

          </table>

        </div>
      </div>
    </div>
  </div>
</div>
