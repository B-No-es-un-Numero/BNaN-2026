<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Empresas</h4>

  <a
    class="btn btn-sm btn-purple"
    [routerLink]="['/dashboard/empresas-form', '']"
  >
    <i class="bi bi-plus-lg"></i>
    Nueva Empresa
  </a>
</div>

<div class="mb-3">
  <div class="input-group">
    <span class="input-group-text bg-white border-end-0">
      <i class="bi bi-search"></i>
    </span>

    <input
      type="text"
      class="form-control border-start-0"
      placeholder="Buscar empresas..."
      [value]="searchTerm()"
      (input)="onSearch($event)"
    />
  </div>
</div>

<div class="card border-0 shadow-sm">
  <div class="table-responsive">
    <table class="table align-middle mb-0">

      <thead class="bg-light">
        <tr>
          <th>Nombre</th>
          <th>CUIL</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Estado</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>

      <tbody>
        @for (company of filteredCompanyList(); track company.id) {
        <tr>

          <td>{{ company.name }}</td>
          <td>{{ company.cuil }}</td>
          <td>{{ company.email }}</td>
          <td>{{ company.phone }}</td>

          <td>
            @if (company.enabled) {
            <span class="badge bg-success-subtle text-success">
              Activa
            </span>
            } @else {
            <span class="badge bg-secondary-subtle text-secondary">
              Inactiva
            </span>
            }
          </td>

          <td class="text-end">

            <a
              class="btn btn-sm btn-outline-primary me-2"
              [routerLink]="['/dashboard/empresas-detalle', company.id]"
            >
              <i class="bi bi-eye"></i>
            </a>

            <a
              class="btn btn-sm btn-outline-primary me-2"
              [routerLink]="['/dashboard/empresas-form', company.id]"
            >
              <i class="bi bi-pencil"></i>
            </a>

            <a
                class="btn btn-sm btn-outline-danger"
                (click)="deleteCompany(company.id)"
            >
                <i class="bi bi-trash"></i>
            </a>

          </td>
        </tr>
        }
      </tbody>

    </table>
  </div>
</div>
