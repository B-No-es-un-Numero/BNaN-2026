@if (isOpen()) {
    <div class="toast-container position-fixed bottom-0 end-0 p-3 toast-global">
        <div class="toast show align-items-center text-bg-{{bgClass()}} border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body">
                    <i class="bi {{ iconClass() }} me-2"></i>
                    {{message()}}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close" (click)="onClose()"></button>
            </div>
        </div>
    </div>
}
